<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finnvisor Admin</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="login-page" id="loginPage">

    <div class="login-box">

        <h1>Finnvisor</h1>

        <p>Admin Login</p>

        <input
            type="password"
            id="tokenInput"
            placeholder="Enter Admin Password">

        <button onclick="loadEnquiries()">

            Login

        </button>

        <p id="loginError"></p>

    </div>

</div>


<div class="dashboard" id="dashboard" style="display:none;">

<header>

<h2>Finnvisor Admin Dashboard</h2>

<button onclick="logout()">

Logout

</button>

</header>

<div class="stats">

<div class="card">

<h3>Total Enquiries</h3>

<p id="totalCount">0</p>

</div>

<div class="card">

<h3>Today's Enquiries</h3>

<p id="todayCount">0</p>

</div>

</div>

<div class="search">

<input
type="text"
id="searchInput"
placeholder="Search by Name, Phone or Email">

</div>

<div id="tableContainer"></div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
